<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📊 สถานะงาน ENG / DS / CAM</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    ul, li { list-style:none; margin:0; padding:0; }
    :root{
      --primary-blue:#2196f3; --dark-blue:#1976d2;
      --light-gray:#f5f7fa;  --medium-gray:#e0e6ed;
      --text-color:#4a5568;  --card-bg:#ffffff;
      --col-min-width:250px;
      --available-green:#22c55e; --available-bg:#f0fdf4; --available-border:#bbf7d0;
      --stop-red:#ef4444; --stop-bg:#ffebee; --stop-border:#fca5a5;
    }
    body{ font-family:'Inter',sans-serif; background:var(--light-gray); color:var(--text-color);
      margin:0; padding:8px; display:flex; flex-direction:column; align-items:center; width:100%; min-height:100vh; }
    .header{ width:100%; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center;
      border-bottom:1px solid var(--medium-gray); margin-bottom:8px; padding-bottom:8px; gap:8px; }
    .header h2{ font-size:1.8em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .filters{ display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; flex-grow:1; align-items:center; }
    .filters select, .filters button{ font-size:14px; padding:6px 12px; min-width:120px; }

    .dashboard-container{ display:grid; grid-template-columns:repeat(auto-fit, minmax(var(--col-min-width),1fr)); gap:10px; width:100%; }
    .department-column{ background:#fff; border-radius:10px; box-shadow:0 5px 15px rgba(0,0,0,.08); padding:10px; display:flex; flex-direction:column; min-width:var(--col-min-width); }
    .department-column h3{ text-align:center; color:var(--primary-blue); font-size:1.3em; font-weight:600; margin:0 0 8px; }
    .resource-box{ background:#f5f7fa; border-radius:8px; padding:5px; margin-bottom:5px; display:flex; flex-direction:column; max-height:900px; overflow-y:auto; }
    .resource-box h4{ color:#1976d2; font-size:.95em; font-weight:500; margin:0 0 5px; }
    .resource-box ul li{ margin:0 0 6px; border:1px solid var(--medium-gray); border-radius:6px; background:#fff; overflow:hidden; }
    .job-header{ padding:8px 12px; font-size:.9em; }
    .status-completed{ background:#eff6ff!important; border-color:#93c5fd; }
    .hold-job .job-header{ background:#fffde7; border-left:4px solid #facc15; }
    .pending-inspect .job-header{ background:#fff7ed; border-left:4px solid #fdba74; }

    .badge.badge-urgent{
      display:inline-block; font-size:.72em; font-weight:700; padding:2px 6px; border-radius:999px;
      background:#ffe5e5; color:#b91c1c; border:1px solid #fecaca; vertical-align:middle; margin-left:6px;
    }

    .status-available, .status-out-of-service{ text-align:center; padding:8px!important; font-weight:600;
      cursor:pointer; border-radius:6px; border:1px solid var(--available-border); }
    .status-available{ background:var(--available-bg); color:var(--available-green); border-color:var(--available-border); }
    .status-out-of-service{ background:var(--stop-bg); color:var(--stop-red); border-color:var(--stop-border); }

    #loadingSpinner{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); justify-content:center;
      align-items:center; z-index:1000; color:#fff; font-size:20px; gap:15px; flex-direction:column; }
    #loadingSpinner::before{ content:""; border:3px solid rgba(255,255,255,.3); border-top:3px solid #fff;
      border-radius:50%; width:30px; height:30px; animation:spin 1s linear infinite; }
    @keyframes spin{ 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }

    /* Modal */
    #startJobModal{ display:none; position:fixed; inset:0; z-index:1100; background:rgba(0,0,0,.45);
      align-items:center; justify-content:center; }
    #startJobModal .card{ background:#fff; padding:16px; border-radius:10px; min-width:280px; max-width:90vw; }

    /* Search Modal */
    #searchModal{ display:none; position:fixed; inset:0; z-index:1200; background:rgba(0,0,0,.45);
      align-items:center; justify-content:center; }
    #searchModal .card{ background:#fff; padding:16px; border-radius:10px; min-width:300px; max-width:90vw; }
  </style>
</head>
<body>
  <div class="header">
    <h2>📊 สถานะงาน ENG / DS / CAM</h2>
    <div class="filters">
      <select id="deptFilter" onchange="refresh()">
        <option value="ALL">แสดงทุกแผนก</option>
        <option value="ENG">ENG</option>
        <option value="DS">DS</option>
        <option value="CAM">CAM</option>
        <option value="ENG_QUEUED">ENG รอคิว</option>
        <option value="DS_QUEUED">DS รอคิว</option>
        <option value="CAM_QUEUED">CAM รอคิว</option>
        <option value="COMPLETED">งานที่เพิ่งเสร็จสิ้น</option>
        <option value="ALL_QUEUED">งานรอคิวทั้งหมด</option>
      </select>
      <button onclick="refresh()">🔄 Refresh</button>
      <button onclick="openReport()">📈 Report</button>
      <button onclick="openSearchDialog()">🔎 ค้นหา</button>
      <button onclick="openDesign()">🎨 Design</button>
      <span id="lastUpdated" style="font-size:.8em;color:#334155"></span>
    </div>
  </div>

  <div style="margin-bottom:10px;text-align:center;width:100%;">
    <label>📐 ขนาดกล่องแสดงผล (px):</label>
    <input type="range" min="200" max="600" value="250"
      oninput="document.documentElement.style.setProperty('--col-min-width', `${this.value}px`);
               document.getElementById('colWidthLabel').textContent = `${this.value}px`;" />
    <span id="colWidthLabel">250px</span>
  </div>

  <div class="dashboard-container" id="dashboardContainer"><div>กำลังโหลด...</div></div>
  <div id="loadingSpinner"><span>⏳ กำลังโหลดข้อมูล...</span></div>

  <!-- Modal เริ่มงาน: เลือกทรัพยากร -->
  <div id="startJobModal">
    <div class="card">
      <h3 style="margin:0 0 10px;">▶ เริ่มงาน — เลือกทรัพยากร</h3>
      <label for="resourceSelect" style="font-size:.9em;color:#475569;">ทรัพยากร:</label>
      <select id="resourceSelect" style="width:100%; padding:6px 8px; margin:6px 0 14px;"></select>
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <button onclick="cancelStartJob()">ยกเลิก</button>
        <button onclick="confirmStartJob()">✅ ยืนยันเริ่มงาน</button>
      </div>
    </div>
  </div>

  <!-- Modal ค้นหา Barcode -->
  <div id="searchModal">
    <div class="card">
      <h3 style="margin:0 0 10px;">🔎 ค้นหาสถานะงานด้วย Barcode</h3>
    <div style="display:flex; gap:8px;">
        <input id="searchBarcodeInput" type="text" placeholder="กรอก Barcode เช่น 1-6807076A"
               style="flex:1; padding:8px 10px;" />
        <button onclick="doBarcodeSearch()">ค้นหา</button>
      </div>
      <div id="searchResult" style="margin-top:12px; font-size:16px;"></div>
      <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:12px;">
        <button onclick="closeSearchDialog()">ปิด</button>
      </div>
    </div>
  </div>

  <script>
  // เปิดหน้า Report ของ Web App เดียวกัน (ใช้พารามิเตอร์ view=report)
  function openReport(){
    google.script.run.withSuccessHandler(function(baseUrl){
      const url = baseUrl.replace(/\/dev$/,'/exec') + '?view=report';
      window.open(url, '_blank', 'noopener');
    }).getWebAppUrl();
  }

  const REFRESH_INTERVAL_SECONDS = 30;
  let refreshIntervalId;
  const $spinner = () => document.getElementById('loadingSpinner');

  // รายชื่อทรัพยากรสำหรับฟอร์มเริ่มงาน
  const RESOURCE_CHOICES = {
    "DS":  ["DS1(Deer)","DS2(Deam)","DS3(Biw)","DS4(Ming)","DS5(Jay)","DS6(Moss)","DS7(Boll)","DS8(Team)","DS9(Night)","DS10(Peet)"],
    "CAM": ["CAM1(Boy)","CAM2(Jit)","CAM3"],
    "ENG": ["EN1(Wat)","EN2(Neung)","EN3(Boom)","EN4(Jay)","EN5(PAT)","EN6(KAMPHOL)","EN7(ART)","EN8(-)"]
  };

  function getJobPriorityRank(job) {
    if ((job.customClass || '').includes('priority-extreme-urgent') || job.priority === 'urgent') return 0;
    if (job.status === 'ล่าช้า') return 1;
    return 2;
  }

  function getQueuedJobsForDepartment(deptData, deptName) {
    const queued = [];
    if (deptData && deptData[deptName]) {
      Object.values(deptData[deptName]).flat().forEach(j => {
        if (['รอคิว','ล่าช้า','กรุณารีบเร่งงาน'].includes(j.status)) queued.push(j);
      });
    }
    return queued;
  }

  // ===== ปุ่มควบคุมพื้นฐาน =====
  function uiHold(barcode) {
    const reason = prompt("สาเหตุหยุด (รออุปกรณ์ลูกค้า/งานแรก/รออนุมัติ/ตรวจไม่ผ่าน):","");
    if (reason === null || reason.trim() === "") return;
    $spinner().style.display = 'flex';
    google.script.run.withSuccessHandler(() => { refresh(true); $spinner().style.display = 'none'; })
      .withFailureHandler(e => { alert('หยุดงานไม่สำเร็จ: ' + e.message); $spinner().style.display = 'none'; })
      .holdJob(barcode, reason.trim());
  }
  function uiResume(barcode) {
    $spinner().style.display = 'flex';
    google.script.run.withSuccessHandler(() => { refresh(true); $spinner().style.display = 'none'; })
      .withFailureHandler(e => { alert('เริ่มงานต่อไม่สำเร็จ: ' + e.message); $spinner().style.display = 'none'; })
      .resumeJob(barcode);
  }
  function uiSendToInspect(barcode) {
    if (!confirm(`ยืนยัน "ส่งตรวจ" สำหรับ ${barcode} ?`)) return;
    $spinner().style.display = 'flex';
    google.script.run.withSuccessHandler(() => { refresh(true); $spinner().style.display = 'none'; })
      .withFailureHandler(e => { alert('ส่งตรวจไม่สำเร็จ: ' + e.message); $spinner().style.display = 'none'; })
      .sendToInspect(barcode);
  }
  function uiSendToSale(barcode) {
    if (!confirm(`ยืนยัน "ส่งให้ Sale" สำหรับ ${barcode} ?`)) return;
    $spinner().style.display = 'flex';
    google.script.run.withSuccessHandler(() => { refresh(true); $spinner().style.display = 'none'; })
      .withFailureHandler(e => { alert('ส่งให้ Sale ไม่สำเร็จ: ' + e.message); $spinner().style.display = 'none'; })
      .sendToSales(barcode);
  }
  function uiSendToCAM(barcode) {
    if (!confirm(`ยืนยัน "ส่งให้ CAM" สำหรับ ${barcode} ?`)) return;
    $spinner().style.display = 'flex';
    google.script.run.withSuccessHandler(() => { refresh(true); $spinner().style.display = 'none'; })
      .withFailureHandler(e => { alert('ส่งให้ CAM ไม่สำเร็จ: ' + e.message); $spinner().style.display = 'none'; })
      .sendToCAM(barcode);
  }
  function uiSendToPRD(barcode) {
    if (!confirm(`ยืนยัน "ส่งให้ PRD" สำหรับ ${barcode} ?`)) return;
    $spinner().style.display = 'flex';
    google.script.run.withSuccessHandler(() => { refresh(true); $spinner().style.display = 'none'; })
      .withFailureHandler(e => { alert('ส่งให้ PRD ไม่สำเร็จ: ' + e.message); $spinner().style.display = 'none'; })
      .sendToPRD(barcode);
  }

  // ===== Modal เริ่มงานแบบเลือกทรัพยากร =====
  let START_BARCODE = null, START_DEPT = null;
  function showStartJobForm(barcode, dept) {
    START_BARCODE = barcode; START_DEPT = dept;
    const sel = document.getElementById('resourceSelect'); sel.innerHTML = '';
    (RESOURCE_CHOICES[dept] || []).forEach(name => {
      const opt = document.createElement('option'); opt.value = name; opt.textContent = name; sel.appendChild(opt);
    });
    document.getElementById('startJobModal').style.display = 'flex';
  }
  function cancelStartJob() {
    document.getElementById('startJobModal').style.display = 'none';
    START_BARCODE = null; START_DEPT = null;
  }
  function confirmStartJob() {
    const resource = document.getElementById('resourceSelect').value;
    if (!START_BARCODE || !START_DEPT || !resource) { alert('ข้อมูลไม่ครบ'); return; }
    $spinner().style.display = 'flex';
    google.script.run.withSuccessHandler(() => { cancelStartJob(); refresh(true); $spinner().style.display = 'none'; })
      .withFailureHandler(err => { alert('เริ่มงานไม่สำเร็จ: ' + err.message); $spinner().style.display = 'none'; })
      .startJobWithResource(START_BARCODE, START_DEPT, resource);
  }

  // ===== Modal ค้นหา Barcode =====
  function openSearchDialog() {
    const el = document.getElementById('searchModal');
    document.getElementById('searchResult').innerHTML = '';
    const inp = document.getElementById('searchBarcodeInput');
    el.style.display = 'flex'; setTimeout(() => inp.focus(), 50);
  }
  function closeSearchDialog() {
    document.getElementById('searchModal').style.display = 'none';
  }
  function doBarcodeSearch() {
    const q = document.getElementById('searchBarcodeInput').value.trim();
    const box = document.getElementById('searchResult');
    if (!q) { alert('กรุณากรอก Barcode'); return; }
    $spinner().style.display = 'flex';
    google.script.run
      .withSuccessHandler(res => {
        $spinner().style.display = 'none';
        if (!res || !res.ok) { box.innerHTML = `❌ ${res && res.message ? res.message : 'ไม่พบข้อมูล'}`; return; }
        box.innerHTML =
          `📌 <b>Barcode:</b> ${res.barcode}<br>` +
          `📋 <b>สถานะ:</b> ${res.status || '-'}<br>` +
          `👤 <b>ผู้ทำงาน:</b> ${res.resource || '-'}` +
          (res.type ? `<br>🧾 <b>ประเภท:</b> ${res.type}` : '') +
          (res.dept ? `<br>🏷️ <b>แผนก:</b> ${res.dept}` : '') +
          (res.note ? `<br>🗒️ <b>หมายเหตุ:</b> ${res.note}` : '');
      })
      .withFailureHandler(err => { $spinner().style.display = 'none'; box.innerHTML = '❌ เกิดข้อผิดพลาด: ' + (err && err.message ? err.message : err); })
      .getJobByBarcode(q);
  }
  document.addEventListener('keydown', e => {
    const modal = document.getElementById('searchModal');
    if (modal && modal.style.display === 'flex' && e.key === 'Enter') doBarcodeSearch();
    if (modal && modal.style.display === 'flex' && e.key === 'Escape') closeSearchDialog();
  });

  // ===== การ์ดงาน =====
  function createJobListItem(job, index = null, options = { showActions: true, deptName: null, showStartWhenQueued: false }) {
    const li = document.createElement("li");
    li.className = job.customClass || '';
    if (job.status === 'เสร็จแล้ว') li.classList.add('status-completed');
    if (job.status === 'รอตรวจ')   li.classList.add('pending-inspect');

    const prefix = index !== null ? `<span style="font-weight:bold;color:#0f3c7a;margin-right:5px;">${index + 1}</span>` : '';
    let icon = '';
    if      (job.status === 'เริ่มงาน') icon = '➡️';
    else if (['รอคิว','ล่าช้า','กรุณารีบเร่งงาน'].includes(job.status)) icon = '⏳';
    else if (job.status === 'รอตรวจ') icon = '🧪';
    else if (job.status === 'เสร็จแล้ว') icon = '✅';
    else if (job.status === 'หยุดงาน')   icon = '⏸';

    const urgentBadge = (job.priority === 'urgent')
      ? ` <span class="badge badge-urgent">🚒 URGENT</span>` : '';

    const header =
      `${prefix} ${icon} ${job.barcode} ${urgentBadge} ` +
      `<span style="color:#666">(${job.type || "-"})</span><br>` +
      `<small>${job.duration || ""}</small>`;

    let actions = '';
    if (options.showActions) {
      const btns = [];
      if (job.status === 'รอคิว' && options.deptName) {
        btns.push(`<button onclick="showStartJobForm('${job.barcode}','${options.deptName}')" style="padding:4px 8px;">▶ เริ่มงาน</button>`);
      }
      if (job.status === 'หยุดงาน') {
        btns.push(`<button onclick="uiResume('${job.barcode}')" style="padding:4px 8px;">▶ เริ่มงานต่อ</button>`);
      } else {
        btns.push(`<button onclick="uiHold('${job.barcode}')" style="padding:4px 8px;">⏸ หยุดงาน</button>`);
      }
      if (options.deptName === 'ENG' || options.deptName === 'DS') {
        btns.push(`<button onclick="uiSendToInspect('${job.barcode}')" style="padding:4px 8px;">🧪 ส่งตรวจ</button>`);
        if (job.type === 'แบบผลิต' || job.type === 'แบบผลิต-วายริ่ง') btns.push(`<button onclick="uiSendToCAM('${job.barcode}')" style="padding:4px 8px;">📦 ส่งให้ CAM</button>`);
        else btns.push(`<button onclick="uiSendToSale('${job.barcode}')" style="padding:4px 8px;">📦 ส่งให้ Sale</button>`);
      }
      if (options.deptName === 'CAM') {
        btns.push(`<button onclick="uiSendToPRD('${job.barcode}')" style="padding:4px 8px;">🏭 ส่งให้ PRD</button>`);
      }
      actions = `<div style="display:flex;gap:6px;padding:8px 12px;border-top:1px solid #eee;flex-wrap:wrap;">${btns.join('')}</div>`;
    }

    if (options.showStartWhenQueued && job.status === 'รอคิว' && options.deptName) {
      actions += `<div style="display:flex;gap:6px;padding:8px 12px;border-top:1px solid #eee;flex-wrap:wrap;">
        <button onclick="showStartJobForm('${job.barcode}','${options.deptName}')" style="padding:4px 8px;">▶ เริ่มงาน</button>
      </div>`;
    }

    li.innerHTML = `<div class="job-header">${header}</div>${actions}`;
    return li;
  }

  function toggleResourceStatus(resourceName, newStatus) {
    const loading = document.getElementById('loadingSpinner');
    loading.style.display = 'flex';
    let reason = '';
    if (newStatus === 'Out of Service') {
      reason = prompt(`เหตุผลที่ ${resourceName} หยุดทำการ:`, '');
      if (reason === null || reason.trim() === '') { alert('กรุณากรอกเหตุผล'); loading.style.display = 'none'; return; }
    }
    google.script.run.withSuccessHandler(() => {
      alert(`✅ ${resourceName}: ${newStatus === 'Available' ? 'ว่าง' : 'หยุดทำการ'}`);
      refresh(true); loading.style.display = 'none';
    }).withFailureHandler(err => {
      alert('เปลี่ยนสถานะไม่สำเร็จ: ' + err.message); loading.style.display = 'none';
    }).updateResourceStatus(resourceName, newStatus, reason);
  }

  function render(data) {
    const container = document.getElementById("dashboardContainer");
    container.innerHTML = "";
    const allowed = ["ENG","DS","CAM"];
    const selected = document.getElementById("deptFilter").value;
    
    // ✅ Guard: ตรวจสอบว่ามี dashboardData หรือไม่
    if (!data || !data.dashboardData) {
      console.error('❌ Dashboard data is missing:', data);
      console.error('❌ Data structure:', JSON.stringify(data, null, 2));
      
      container.innerHTML = `
        <div style="text-align:center; padding:50px; background:#fff; border-radius:10px; margin:20px;">
          <h2 style="color:#ef4444;">❌ ไม่สามารถโหลดข้อมูลได้</h2>
          <p style="color:#6b7280; margin:10px 0;">ไม่พบข้อมูล dashboardData จากเซิร์ฟเวอร์</p>
          <div style="background:#f3f4f6; padding:15px; border-radius:5px; margin:15px 0; text-align:left;">
            <h4 style="color:#374151; margin:0 0 10px;">🔍 รายละเอียดข้อมูลที่ได้รับ:</h4>
            <pre style="background:#1f2937; color:#f3f4f6; padding:10px; border-radius:3px; overflow:auto; font-size:12px; white-space:pre-wrap;">${JSON.stringify(data, null, 2)}</pre>
          </div>
          <p style="color:#9ca3af; font-size:0.9em;">กรุณาตรวจสอบการเชื่อมต่อหรือรีเฟรชหน้า</p>
          <button onclick="refresh()" style="padding:10px 20px; background:#3b82f6; color:#fff; border:none; border-radius:5px; cursor:pointer; margin:5px;">
            🔄 รีเฟรชข้อมูล
          </button>
          <button onclick="location.reload()" style="padding:10px 20px; background:#10b981; color:#fff; border:none; border-radius:5px; cursor:pointer; margin:5px;">
            🔃 รีโหลดหน้า
          </button>
        </div>
      `;
      
      // ✅ หยุด loading
      const loading = document.getElementById('loadingSpinner');
      if (loading) loading.style.display = 'none';
      
      return;
    }
    
    // ✅ Guard: ตรวจสอบว่าแผนกที่ต้องการมีข้อมูลหรือไม่
    const missingDepts = allowed.filter(dept => !data.dashboardData[dept]);
    if (missingDepts.length > 0) {
      console.warn('⚠️ Missing departments:', missingDepts);
      console.warn('⚠️ Available departments:', Object.keys(data.dashboardData));
    }
    
    // ✅ Guard: ตรวจสอบว่าแต่ละแผนกเป็น array หรือไม่
    const invalidDepts = allowed.filter(dept => {
      const deptData = data.dashboardData[dept];
      return !Array.isArray(deptData);
    });
    
    if (invalidDepts.length > 0) {
      console.error('❌ Invalid department data types:', invalidDepts);
      console.error('❌ Department data types:', 
        Object.keys(data.dashboardData).reduce((acc, dept) => {
          acc[dept] = typeof data.dashboardData[dept];
          return acc;
        }, {})
      );
    }
    
    document.getElementById("lastUpdated").textContent = `อัปเดตล่าสุด: ${data.lastUpdated || data.timestamp || new Date().toLocaleString('th-TH')}`;

    // คอลัมน์แผนกหลัก
    if (selected === "ALL" || allowed.includes(selected)) {
      const show = (selected === "ALL") ? allowed : [selected];
      show.forEach(dept => {
        const column = document.createElement("div");
        column.className = "department-column";
        column.innerHTML = `<h3>${dept}</h3>`;
        
        // ✅ Guard: ตรวจสอบว่าแผนกนี้มีข้อมูลหรือไม่
        const resources = data.dashboardData[dept];
        if (!resources || !Array.isArray(resources)) {
          console.warn(`⚠️ Department ${dept} has no valid data:`, resources);
          column.innerHTML += `
            <div style="text-align:center; padding:20px; color:#6b7280;">
              <p>ไม่มีข้อมูลสำหรับแผนก ${dept}</p>
              <small>ประเภทข้อมูล: ${typeof resources}</small>
              <br><small>ค่า: ${JSON.stringify(resources)}</small>
            </div>
          `;
          container.appendChild(column);
          return;
        }

        const base = (dept === 'ENG') ? 'EN' : dept;
        
        // ✅ แก้จาก Object.keys(resources) เป็นการจัดกลุ่มตาม Resource
        const resourceGroups = {};
        resources.forEach(job => {
          const resource = String(job.Resource || job['ผู้รับผิดชอบ'] || 'ไม่ระบุ').trim();
          if (!resourceGroups[resource]) {
            resourceGroups[resource] = [];
          }
          resourceGroups[resource].push(job);
        });
        
        const names = Object.keys(resourceGroups).filter(n => n !== dept && n !== base).sort((a, b) => a.localeCompare(b, undefined, { numeric:true }));

        names.forEach(resource => {
          const box = document.createElement("div");
          box.className = "resource-box";
          const allJobs = resourceGroups[resource] || [];
          box.innerHTML = `<h4>⚙️ ทีมงาน: ${resource} (${allJobs.length})</h4><ul></ul>`;
          const ul = box.querySelector("ul");

          if (allJobs.length === 0) {
            const st = (data.resourceStatuses || {})[resource] || 'Available';
            if (st === 'Out of Service') ul.innerHTML = `<li class="status-out-of-service" onclick="toggleResourceStatus('${resource}','Available')">⛔ หยุดทำการ</li>`;
            else ul.innerHTML = `<li class="status-available" onclick="toggleResourceStatus('${resource}','Out of Service')">✅ ว่าง</li>`;
          } else {
            [...allJobs].sort((a,b) => getJobPriorityRank(a) - getJobPriorityRank(b)).forEach((job, i) => {
              ul.appendChild(createJobListItem(job, i, { showActions:true, deptName:dept }));
            });
          }
          column.appendChild(box);
        });
        container.appendChild(column);
      });
    }

    // งานที่เพิ่งเสร็จสิ้น
    if (selected === "ALL" || selected === "COMPLETED") {
      const col = document.createElement("div");
      col.className = "department-column completed-column";
      col.innerHTML = `<h3>✅ งานที่เพิ่งเสร็จสิ้น</h3>`;
      const box = document.createElement("div"); box.className = "resource-box";
      const jobs = data.recentlyFinishedJobs || [];
      box.innerHTML = `<h4>งาน ${jobs.length} ล่าสุด</h4><ul></ul>`;
      const ul = box.querySelector("ul");
      if (jobs.length > 0) {
        jobs.slice(0, 50).forEach((j, i) => { ul.appendChild(createJobListItem(j, i, { showActions:false })); });
      } else {
        ul.innerHTML = `<li class="status-available"><span>ยังไม่มีงานที่เพิ่งเสร็จสิ้น</span></li>`;
      }
      col.appendChild(box); container.appendChild(col);
    }

    // งานรอคิวทั้งหมด
    if (selected === "ALL" || selected === "ALL_QUEUED") {
      const col = document.createElement("div");
      col.className = "department-column all-queued-column";
      const list = (data.allQueuedJobs || []).filter(j => ['ENG','DS','CAM'].includes(j.dept));
      col.innerHTML = `<h3>⏳ งานรอคิวทั้งหมด (${list.length})</h3>`;
      const box = document.createElement("div"); box.className = "resource-box";
      box.innerHTML = `<h4>&nbsp;</h4><ul></ul>`;
      const ul = box.querySelector("ul");

      if (list.length > 0) {
        list.sort((a,b) => getJobPriorityRank(a) - getJobPriorityRank(b)).forEach((j, i) => {
          ul.appendChild(createJobListItem(j, i, { showActions: false, deptName: null, showStartWhenQueued: false }));
        });
      } else {
        ul.innerHTML = `<li class="status-available"><span>ไม่มีงานรอคิวในขณะนี้ 🎉</span></li>`;
      }
      col.appendChild(box); container.appendChild(col);
    }

    // คิวรายแผนก
    const byDept = (dname, title) => {
      const list = getQueuedJobsForDepartment(data.dashboardData, dname);
      const col  = document.createElement("div");
      col.className = "department-column";
      col.innerHTML = `<h3>${title} (${list.length})</h3>`;
      const box = document.createElement("div"); box.className = "resource-box";
      box.innerHTML = `<h4>&nbsp;</h4><ul></ul>`;
      const ul = box.querySelector("ul");
      if (list.length > 0) {
        list.sort((a,b) => getJobPriorityRank(a) - getJobPriorityRank(b)).forEach((j,i) => {
          ul.appendChild(createJobListItem(j, i, { showActions:false, deptName: dname, showStartWhenQueued:true }));
        });
      } else {
        ul.innerHTML = `<li class="status-available"><span>ไม่มีงานรอคิวสำหรับแผนก ${dname} 🎉</span></li>`;
      }
      col.appendChild(box); container.appendChild(col);
    };
    if (selected === "ALL" || selected === "ENG_QUEUED") byDept('ENG','⏳ ENG รอคิว');
    if (selected === "ALL" || selected === "DS_QUEUED")  byDept('DS','⏳ DS รอคิว');
    if (selected === "ALL" || selected === "CAM_QUEUED") byDept('CAM','⏳ CAM รอคิว');
  }

function openDesign(){
  google.script.run.withSuccessHandler(function(baseUrl){
    const url = baseUrl.replace(/\/dev$/,'/exec') + '?view=design'; // ✅ แก้ตรงนี้
    window.open(url, '_blank', 'noopener');
  }).getWebAppUrl();
}


  function refresh(isSilent = false) {
    const loading = document.getElementById('loadingSpinner');
    if (!isSilent) loading.style.display = 'flex';
    
    // ✅ ใช้ WEBAPP_URL ที่ inject จาก template (Google Apps Script)
    const WEBAPP_URL = '<? WEBAPP_URL ?>';
    const BUILD_ID = '<? BUILD_ID ?>';
    const apiUrl = WEBAPP_URL + '?api=dashboardData&t=' + Date.now();
    
    console.log('[refresh] WEBAPP_URL from template: ' + WEBAPP_URL);
    console.log('[refresh] BUILD_ID from template: ' + BUILD_ID);
    console.log('[refresh] Fetching from:', apiUrl);
    
    // ✅ ตรวจสอบว่า WEBAPP_URL ถูก inject หรือไม่
    if (!WEBAPP_URL || WEBAPP_URL.trim() === '' || WEBAPP_URL.includes('<?')) {
      console.error('[refresh] WEBAPP_URL not injected properly!');
      document.getElementById("dashboardContainer").innerHTML = `
        <div style="text-align:center; padding:50px; background:#fff; border-radius:10px; margin:20px;">
          <h2 style="color:#ef4444;">❌ WEBAPP_URL ไม่ถูก inject</h2>
          <p style="color:#6b7280; margin:10px 0;">Template ไม่ทำงาน - ต้องเปิดผ่าน /exec URL เท่านั้น ไม่ใช่ /dev preview</p>
          <p style="color:#6b7280; margin:10px 0;"><strong>Value:</strong> <code>${WEBAPP_URL}</code></p>
          <p><strong>Build ID:</strong> <code>${BUILD_ID}</code></p>
          <p><strong>วิธีแก้:</strong></p>
          <ul style="text-align:left; display:inline-block;">
            <li>1. Deploy as Web App (ถ้ายังไม่มี)</li>
            <li>2. Copy URL จากการ Deploy (ลงท้ายด้วย /exec)</li>
            <li>3. เปิดหน้าผ่าน /exec URL เท่านั้น</li>
            <li>4. ห้ามเปิดจาก /dev หรือ preview</li>
          </ul>
          <button onclick="location.reload()" style="background:#c62828;color:white;border:none;padding:10px 20px;border-radius:4px;cursor:pointer;margin-top:10px;">รีเฟรชหน้า</button>
        </div>
      `;
      loading.style.display = 'none';
      return;
    }
    
    fetch(apiUrl, {
      method: 'GET',
      headers: {
        'Accept': 'application/json',
        'Cache-Control': 'no-cache'
      }
    })
    .then(response => {
      console.log('[refresh] Response status:', response.status);
      console.log('[refresh] Response headers:', Object.fromEntries(response.headers.entries()));
      console.log('[refresh] Content-Type:', response.headers.get('content-type'));
      
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }
      
      // ✅ ตรวจสอบ content-type ก่อน res.json()
      const contentType = response.headers.get('content-type') || '';
      
      if (!contentType.includes('application/json')) {
        // ✅ ถ้าไม่ใช่ JSON ให้ res.text() และแสดงในกล่อง debug
        return response.text().then(text => {
          throw new Error('INVALID_CONTENT_TYPE: ' + contentType + '\n\nResponse text:\n' + text.substring(0, 500));
        });
      }
      
      return response.json();
    })
    .then(data => {
      console.log('[refresh] Data received successfully:', data);
      console.log('[refresh] Data type:', typeof data);
      
      if (!data || typeof data !== 'object') {
        throw new Error('Invalid data format: received ' + typeof data);
      }
      
      if (data.ok === false || data.error) {
        throw new Error('API returned error: ' + (data.error || 'Unknown error'));
      }
      
      // ✅ ถ้าเป็นปกติ render dashboard
      const dashboardData = data.data || data.dashboardData || {};
      _renderDashboard(dashboardData);
      
      const now = new Date().toLocaleTimeString('th-TH');
      document.getElementById('lastUpdated').textContent = '🕐 ' + now;
      
    })
    .catch(error => {
      console.error('[refresh] Fetch error:', error);
      console.error('[refresh] Error type:', error.constructor.name);
      console.error('[refresh] Error message:', error.message);
      console.error('[refresh] Error stack:', error.stack);
      
      const errorMsg = error.message || 'Unknown error';
      const isContentTypeError = errorMsg.includes('INVALID_CONTENT_TYPE') || errorMsg.includes('Expected JSON');
      
      if (isContentTypeError) {
        // ✅ แสดง error ถ้าได้ HTML แทน JSON
        const errorDetails = errorMsg.split('\n\nResponse text:\n');
        const responseText = errorDetails[1] ? errorDetails[1].substring(0, 300) : '';
        
        document.getElementById("dashboardContainer").innerHTML = `
          <div style="text-align:center; padding:50px; background:#fff; border-radius:10px; margin:20px;">
            <h2 style="color:#ef4444;">❌ ได้รับ HTML แทน JSON</h2>
            <p style="color:#6b7280; margin:10px 0;"><strong>Content-Type:</strong> ${error.message.split(':')[1] || 'unknown'}</p>
            <p style="color:#6b7280; margin:10px 0;"><strong>URL ที่เรียก:</strong> <code>${apiUrl}</code></p>
            <p style="color:#6b7280; margin:10px 0;"><strong>BUILD_ID:</strong> ${BUILD_ID}</p>
            ${responseText ? `<pre style="background:#f3f4f6; padding:10px; border-radius:4px; text-align:left; font-size:12px; max-height:200px; overflow:auto;">${responseText}</pre>` : ''}
            <p><strong>สาเหตุที่ได้ HTML:</strong></p>
            <ul style="text-align:left; display:inline-block;">
              <li>• เรียก URL แบบ /dev preview (ต้องใช้ /exec)</li>
              <li>• doGet() ส่งคืน HtmlService หากเป็น API mode</li>
              <li>• Server error ส่ง HTML error page</li>
              <li>• Session หมด / ต้อง login ใหม่</li>
            </ul>
            <button onclick="location.reload()" style="padding:10px 20px; background:#ef4444; color:#fff; border:none; border-radius:4px; cursor:pointer; margin-top:10px;">
              🔃 รีเฟรชหน้า
            </button>
          </div>
        `;
      } else {
        document.getElementById("dashboardContainer").innerHTML = `
          <div style="text-align:center; padding:50px; background:#fff; border-radius:10px; margin:20px;">
            <h2 style="color:#ef4444;">❌ เกิดข้อผิดพลาด</h2>
            <p style="color:#6b7280; margin:10px 0;">⚠️ ${errorMsg}</p>
            <p style="color:#6b7280; margin:10px 0;"><strong>URL:</strong> ${apiUrl}</p>
            <p style="color:#6b7280; margin:10px 0;"><strong>BUILD_ID:</strong> ${BUILD_ID}</p>
            <button onclick="refresh()" style="padding:10px 20px; background:#3b82f6; color:#fff; border:none; border-radius:4px; cursor:pointer; margin:5px;">
              🔄 ลองอีกครั้ง
            </button>
            <button onclick="location.reload()" style="padding:10px 20px; background:#10b981; color:#fff; border:none; border-radius:4px; cursor:pointer; margin:5px;">
              🔃 รีโหลดหน้า
            </button>
          </div>
        `;
      }
      
      loading.style.display = 'none';
    });
    .then(data => {
      if (data === undefined) return; // ถ้าเป็น error แล้วจัดการไปแล้ว
      
      console.log('[refresh] Received data:', data);
      
      // ✅ Handle ok/error structure
      if (data.ok) {
        console.log('[refresh] Success - rendering data');
        render(data.data);
      } else {
        console.error('[refresh] Server error:', data.error);
        document.getElementById("dashboardContainer").innerHTML = `
          <div style="text-align:center; padding:50px; background:#fff; border-radius:10px; margin:20px;">
            <h2 style="color:#ef4444;">❌ เกิดข้อผิดพลาดจากเซิร์ฟเวอร์</h2>
            <p style="color:#6b7280; margin:10px 0;"><strong>ข้อความ:</strong> ${data.error || 'Unknown error'}</p>
            <div style="background:#f3f4f6; padding:15px; border-radius:5px; margin:15px 0; text-align:left;">
              <h4 style="color:#374151; margin:0 0 10px;">🔍 รายละเอียดข้อผิด:</h4>
              <pre style="background:#1f2937; color:#f3f4f6; padding:10px; border-radius:3px; overflow:auto; font-size:12px; white-space:pre-wrap;">${JSON.stringify(data, null, 2)}</pre>
            </div>
            <button onclick="refresh()" style="padding:10px 20px; background:#3b82f6; color:#fff; border:none; border-radius:5px; cursor:pointer; margin:5px;">
              🔄 รีเฟรชข้อมูล
            </button>
            <button onclick="location.reload()" style="padding:10px 20px; background:#10b981; color:#fff; border:none; border-radius:5px; cursor:pointer; margin:5px;">
              🔃 รีโหลดหน้า
            </button>
          </div>
        `;
      }
      
      loading.style.display = 'none';
    })
    .catch(err => {
      console.error('[refresh] Fetch error:', err);
      document.getElementById("dashboardContainer").innerHTML = `
        <div style="text-align:center; padding:50px; background:#fff; border-radius:10px; margin:20px;">
          <h2 style="color:#ef4444;">❌ ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้</h2>
          <p style="color:#6b7280; margin:10px 0;"><strong>ข้อความ:</strong> ${err.message}</p>
          <div style="background:#f3f4f6; padding:15px; border-radius:5px; margin:15px 0; text-align:left;">
            <h4 style="color:#374151; margin:0 0 10px;">🔍 รายละเอียดข้อผิด:</h4>
            <pre style="background:#1f2937; color:#f3f4f6; padding:10px; border-radius:3px; overflow:auto; font-size:12px; white-space:pre-wrap;">${err.stack || err.message}</pre>
          </div>
          <p style="color:#9ca3af; font-size:0.9em;">URL: ${apiUrl}</p>
          <p style="color:#9ca3af; font-size:0.9em;">WEBAPP_URL: ${WEBAPP_URL}</p>
          <button onclick="refresh()" style="padding:10px 20px; background:#3b82f6; color:#fff; border:none; border-radius:5px; cursor:pointer; margin:5px;">
            🔄 รีเฟรชข้อมูล
          </button>
          <button onclick="location.reload()" style="padding:10px 20px; background:#10b981; color:#fff; border:none; border-radius:5px; cursor:pointer; margin:5px;">
            🔃 รีโหลดหน้า
          </button>
        </div>
      `;
      loading.style.display = 'none';
    });
  }


  // ✅ เริ่มต้นโหลด + ตั้ง interval "ครั้งเดียว"
  window.addEventListener('load', () => {
    refresh(); // โหลดครั้งแรกทันที

    if (refreshIntervalId) clearInterval(refreshIntervalId);
    refreshIntervalId = setInterval(() => refresh(true), REFRESH_INTERVAL_SECONDS * 1000);
  });
  </script>
